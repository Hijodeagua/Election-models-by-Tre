[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "election-oracle"
version = "0.1.0"
description = "Election modeling and forecasting system — polling aggregation, weighted averages, and race forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Tre"},
]

dependencies = [
    # Data
    "pandas>=2.1",
    "polars>=0.20",
    # HTTP / API
    "httpx>=0.25",
    "tenacity>=8.2",
    # Scraping
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    # Statistical modeling
    "scipy>=1.11",
    "statsmodels>=0.14",
    "numpy>=1.25",
    # Visualization
    "plotly>=5.18",
    "matplotlib>=3.8",
    # Database
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.14",
    "alembic>=1.13",
    # Dashboard
    "streamlit>=1.29",
    # Config
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    # Scheduling
    "apscheduler>=3.10",
]

[project.optional-dependencies]
bayesian = [
    "pymc>=5.10",
    "arviz>=0.17",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "jupyter>=1.0",
    "ipykernel>=6.27",
]

[project.scripts]
refresh-data = "scripts.refresh_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
