name: Research run

# On-demand experiments that are too slow or too data-hungry to run locally:
# parameter training, the economic signal test, the parameter diff and the
# knob sensitivity sweep. Nothing here runs on a schedule and nothing here
# commits to the repository — each run uploads its report as an artifact and
# prints it to the log, so results can be read without a checkout.
#
# Why CI rather than a laptop: the 538 poll archive and FRED are both
# reachable from runners (the calibrate job has fetched the archive on a
# schedule for months), this repository is public so Actions minutes are free,
# and several of these runs take over an hour.
#
# FRED_API_KEY must exist as a repository secret for the economic jobs. The
# client redacts it from every error message and log line
# (src/data/fred.py: redact) because these logs are world-readable.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which experiment to run"
        required: true
        default: economic_signal
        type: choice
        options:
          - economic_signal
          - train_parameters
          - param_diff
          - sensitivity_sweep
          - fred_probe
      n_trials:
        description: "train_parameters: Optuna trial budget"
        default: "2000"
      seed:
        description: "train_parameters: sampler seed (vary it to test stability)"
        default: "42"
      holdout_cycle:
        description: "Cycle held out (blank = most recent)"
        default: ""
      drop_small_cycles:
        description: "train_parameters: exclude cycles with fewer than N races (0 = keep all)"
        default: "0"
      lookback_days:
        description: "Days of pre-election polls to score on"
        default: "60"

permissions:
  contents: read

concurrency:
  # Research runs are independent of each other; only collapse repeats of the
  # same experiment.
  group: research-${{ github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas statsmodels optuna python-dotenv \
            httpx tenacity pydantic pydantic-settings beautifulsoup4 lxml

      # The 538 archive and MEDSL results change only when a cycle completes,
      # and the FRED vintages never change at all — a past vintage is fixed by
      # definition. Caching keeps a re-run to seconds of setup.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: research-data-${{ hashFiles('src/data/fte_archive.py', 'src/data/mit_results.py', 'src/data/fred.py') }}
          restore-keys: research-data-

      - name: Download training data
        if: >-
          contains(fromJSON('["economic_signal","train_parameters"]'),
                   github.event.inputs.job)
        run: python scripts/download_training_data.py

      - name: Pull FRED vintage panels
        if: github.event.inputs.job == 'economic_signal'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY secret is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions."
            echo "::error::Without it only the current (revised) vintage is"
            echo "::error::available, which would leak the future into the backtest."
            exit 1
          fi
          for d in 2018-11-06 2019-11-05 2020-11-03 2021-11-02 2022-11-08; do
            python scripts/download_economic_data.py --realtime "$d"
          done

      - name: Probe FRED series IDs
        if: github.event.inputs.job == 'fred_probe'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/download_economic_data.py --probe

      - name: Economic signal test
        if: github.event.inputs.job == 'economic_signal'
        run: |
          python scripts/economic_signal.py \
            --lookback-days "${{ github.event.inputs.lookback_days }}" \
            ${{ github.event.inputs.holdout_cycle != '' && format('--holdout-cycle {0}', github.event.inputs.holdout_cycle) || '' }}

      - name: Train parameters
        if: github.event.inputs.job == 'train_parameters'
        run: |
          # --save-path keeps a research run from overwriting the production
          # parameters; the artifact carries the result for inspection.
          python scripts/train_parameters.py \
            --n-trials "${{ github.event.inputs.n_trials }}" \
            --seed "${{ github.event.inputs.seed }}" \
            --lookback-days "${{ github.event.inputs.lookback_days }}" \
            --drop-small-cycles "${{ github.event.inputs.drop_small_cycles }}" \
            ${{ github.event.inputs.holdout_cycle != '' && format('--holdout-cycle {0}', github.event.inputs.holdout_cycle) || '' }} \
            --save-path "data/processed/trained_params_seed${{ github.event.inputs.seed }}.json"

      - name: Parameter diff
        if: github.event.inputs.job == 'param_diff'
        run: |
          # Compares whatever config/trained_params.json holds against the
          # hand-set defaults; a gate-failed run has no file to compare.
          if [ ! -f config/trained_params.json ]; then
            echo "::warning::config/trained_params.json does not exist —"
            echo "::warning::nothing has passed the holdout gate yet."
            exit 0
          fi
          python scripts/param_diff.py --json data/processed/param_diff.json

      - name: Sensitivity sweep
        if: github.event.inputs.job == 'sensitivity_sweep'
        run: python scripts/sensitivity_sweep.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.job }}-${{ github.run_number }}
          path: |
            data/processed/*.json
            data/processed/*.csv
            config/sensitivity_analysis.json
          if-no-files-found: warn
          retention-days: 30
