name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # Minimal subset — PyMC/transformers-dependent tests skip themselves.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff pandas scipy statsmodels numpy \
            pydantic pydantic-settings python-dotenv httpx beautifulsoup4 \
            tenacity lxml respx

      - name: Lint (ruff)
        run: ruff check src scripts tests config

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke-test the JSON export
        run: python scripts/export_json.py --trend-days 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
