name: Refresh tracker data

# Heavy Python runs here in CI; it emits static JSON that the Vercel
# Next.js spoke reads. No live Python server runs on Vercel.

on:
  schedule:
    # Twice daily (10:00 and 22:00 UTC) so the published site stays fresh.
    - cron: "0 10,22 * * *"
  workflow_dispatch:
  # Temporary: also refresh on pushes to the feature branch so live data
  # lands there during development. The workflow's own data commit uses
  # GITHUB_TOKEN, which never re-triggers workflows, so this cannot loop.
  # Remove this trigger when the branch merges.
  push:
    branches:
      - "claude/senate-forecast-updates-lfyz56"
      - "claude/polls-not-updating-v1fltn"
    paths: ["scripts/**", "src/data/**", ".github/workflows/refresh_data.yml"]

permissions:
  contents: write
  # For the staleness alert issue.
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy statsmodels numpy pydantic pydantic-settings \
            python-dotenv httpx beautifulsoup4 tenacity lxml
          # PyMC powers the Jackman state-space estimates. Kept separate so a
          # resolver failure here degrades to tracker-only output instead of
          # killing the whole refresh (export falls back gracefully).
          pip install pymc || echo "pymc install failed — state-space will be skipped"

      - name: Refresh source data
        # refresh_data.py pulls fresh polls into data/fallback/ for offline use.
        # Best-effort: a network/source hiccup must not block the JSON export,
        # which falls back to the committed CSVs.
        continue-on-error: true
        run: |
          if [ -f scripts/refresh_data.py ]; then
            python scripts/refresh_data.py
          else
            echo "scripts/refresh_data.py not found — skipping refresh step."
          fi

      - name: Export static JSON
        # --state-space publishes the house-effect-corrected Jackman estimates
        # alongside the weighted averages (audit item 4). Measured runtime is
        # a few minutes per refresh; export_json degrades to available:false
        # if the fit fails, so this cannot take the trackers down.
        run: python scripts/export_json.py --state-space

      - name: Check feed freshness
        # Warn (never fail) when a feed's newest poll is older than 3 days —
        # publishing yesterday's data beats publishing nothing, but going
        # quiet about it is how the July 2026 VoteHub stall went unnoticed.
        id: staleness
        run: python scripts/check_staleness.py --max-age-days 3

      - name: Open alert issue if feeds are stale
        if: steps.staleness.outputs.stale != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE: ${{ steps.staleness.outputs.stale }}
        run: |
          TITLE="Stale polling feeds detected"
          existing=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            | python -c "import json,sys; print(sum(1 for i in json.load(sys.stdin) if i['title']=='$TITLE'))")
          if [ "$existing" != "0" ]; then
            echo "Alert issue already open — not filing a duplicate."
            exit 0
          fi
          BODY="Feeds stale for >3 days: **${STALE}**. The refresh job keeps publishing the last good data, but the upstream source has stopped delivering new polls. Check the [latest refresh run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) logs — the Wikipedia fallback engages automatically after 72h for approval/generic-ballot; if this issue stays open, the fallback is dry too."
          PAYLOAD=$(BODY_TEXT="$BODY" TITLE_TEXT="$TITLE" python -c "import json,os; print(json.dumps({'title': os.environ['TITLE_TEXT'], 'body': os.environ['BODY_TEXT'], 'labels': ['data-quality']}))")
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$PAYLOAD" > /dev/null && echo "Filed alert issue."
        shell: bash

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/*.json data/fallback/*.csv || true
          if [ -n "$(git status --porcelain)" ]; then
            timestamp=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "Refresh tracker data: $timestamp"
            # Pushing to main triggers a Vercel redeploy of the spoke.
            git push
          else
            echo "No changes to commit."
          fi
